name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Jenis dijana selari dengan wrangler.jsonc
        run: bun run cf-typegen && git diff --exit-code worker-configuration.d.ts

      - name: Type-check + ujian (termasuk sempadan feature)
        run: bun run check

      - name: Migrasi - tiada suntingan, urutan cap masa (docs/00002 §2)
        if: github.event_name == 'pull_request'
        run: bun scripts/check-migrations.ts origin/${{ github.base_ref }}

      - name: Migrasi bersih dari kosong
        run: bun run db:migrate

      - name: Bundle
        run: bunx wrangler deploy --dry-run --outdir dist
